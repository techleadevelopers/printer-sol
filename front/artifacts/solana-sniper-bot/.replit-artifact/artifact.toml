kind = "web"
previewPath = "/"
title = "Solana Sniper Bot"
description = "A secure, responsive operations dashboard for monitoring a Solana token trading bot, preparing to integrate with an independent Go API and WebSocket backend."
version = "1.0.0"
id = "artifacts/solana-sniper-bot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20425

[services.development]
run = "pnpm --filter @workspace/solana-sniper-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solana-sniper-bot", "run", "build" ]
serve = "static"
publicDir = "artifacts/solana-sniper-bot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20425"
BASE_PATH = "/"
